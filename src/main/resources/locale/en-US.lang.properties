# Messages reported by the command framework. They can be reworded here, or translated by adding a locale
# file of the same name, and they are what a client with `clientSidedTranslations` is shown.
# Keys starting with `argument.parse.failure.` and `exception.` belong to the framework.
argument.parse.failure.boolean=<red>'<input>' is not a valid true/false value
argument.parse.failure.char=<red>'<input>' is not a single character
argument.parse.failure.color=<red>'<input>' is not a valid colour
argument.parse.failure.duration=<red>'<input>' is not a valid duration
argument.parse.failure.enum=<red>'<input>' is not one of the allowed values
argument.parse.failure.number=<red>'<input>' is not a valid number
argument.parse.failure.regex=<red>'<input>' does not have the expected format
argument.parse.failure.string=<red>'<input>' is not a valid value
argument.parse.failure.uuid=<red>'<input>' is not a valid UUID
exception.invalid_argument=<red>Invalid argument: <cause>
exception.invalid_sender=<red>You have to be a player to use this command!
exception.invalid_sender_list=<red>You have to be a player to use this command!
exception.invalid_syntax=<red>Invalid command syntax!
exception.no_permission=<red>You do not have permission to do this!
exception.no_such_command=<red>Unknown command
exception.unexpected=<red>Something went wrong while running the command

